<div class="mailbox-list" data-mailbox-list data-mailbox-folder-name="{{ folder }}" data-mailbox-unread="{{ 'true' if unread else 'false' }}" data-mailbox-selected-key="{{ selected.key if selected else '' }}">
  <div class="mailbox-list-heading"><strong>{% if folder == 'sent' %}Gesendet{% elif folder == 'unassigned' %}Unbekannt{% else %}Posteingang{% endif %}</strong><a href="/emails?folder={{ folder }}{% if not unread %}&amp;unread=true{% endif %}" data-mailbox-folder>{% if unread %}Alle{% else %}Nur neu{% endif %}</a></div>
  {% if messages %}
    <div class="mailbox-list-canvas" data-mailbox-list-canvas aria-live="polite"></div>
    <script type="application/json" data-mailbox-list-data>[{% for message in messages %}{% set sender = message.sender or message.recipients or 'Unbekannter Kontakt' %}{% set context = 'Unbekannt' if message.kind == 'unassigned' else message.customers | map(attribute='name') | join(', ') %}{% set time_label = message.occurred_at | berlin_time if message.occurred_at else '' %}{"key":{{ message.key | tojson }},"sender":{{ sender | tojson }},"subject":{{ message.subject | tojson }},"time":{{ time_label | tojson }},"context":{{ context | tojson }},"kind":{{ message.kind | tojson }},"is_unread":{{ message.is_unread | tojson }}}{% if not loop.last %},{% endif %}{% endfor %}]</script>
    <noscript><p class="mailbox-empty">Für die E-Mail-Liste muss JavaScript aktiviert sein.</p></noscript>
  {% else %}
    <p class="mailbox-empty">In diesem Ordner liegen keine E-Mails.</p>
  {% endif %}
</div>
