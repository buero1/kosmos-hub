<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --panel: #fffaf2;
        --ink: #1d2a2f;
        --muted: #6c7469;
        --accent: #0e7c66;
        --accent-soft: #d7efe8;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #fffaf2 0, transparent 25%),
          linear-gradient(180deg, #f9f5ec 0%, var(--bg) 55%, #efe8da 100%);
        color: var(--ink);
      }
      header, main {
        width: min(1100px, calc(100vw - 2rem));
        margin: 0 auto;
      }
      header {
        padding: 2rem 0 1rem;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        margin-right: 1rem;
      }
      h1, h2, h3 {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hero {
        background: rgba(255, 250, 242, 0.75);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(40, 45, 44, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1rem 1.1rem;
      }
      .metric {
        font-size: 2rem;
        margin: 0.4rem 0 0;
      }
      .subtle {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 250, 242, 0.85);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tr:last-child td { border-bottom: none; }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.9rem;
      }
      .detail-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      .detail-list .card p {
        margin: 0.25rem 0;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hero">
        <h1>kosmos-hub</h1>
        <p class="subtle">Phase 1 registry, onboarding and visibility for managed WordPress sites.</p>
        <nav>
          <a href="/">Dashboard</a>
          <a href="/sites">Sites</a>
          <a href="/healthz">Health</a>
        </nav>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
