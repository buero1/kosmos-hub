<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --panel: #fffaf2;
        --ink: #1d2a2f;
        --muted: #6c7469;
        --accent: #0e7c66;
        --accent-soft: #d7efe8;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #fffaf2 0, transparent 25%),
          linear-gradient(180deg, #f9f5ec 0%, var(--bg) 55%, #efe8da 100%);
        color: var(--ink);
      }
      header, main {
        width: min(1100px, calc(100vw - 2rem));
        margin: 0 auto;
      }
      header {
        padding: 2rem 0 1rem;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        margin-right: 1rem;
      }
      h1, h2, h3 {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hero {
        background: rgba(255, 250, 242, 0.75);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(40, 45, 44, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1rem 1.1rem;
      }
      .metric {
        font-size: 2rem;
        margin: 0.4rem 0 0;
      }
      .subtle {
        color: var(--muted);
      }
      .eyebrow {
        margin: 0 0 0.35rem;
        color: var(--accent);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 2rem 0 1rem;
      }
      .section-heading h2 {
        margin: 0;
      }
      .section-heading .subtle {
        margin-bottom: 0;
      }
      .inventory-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.65rem;
        color: var(--muted);
      }
      .inventory-totals span {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 0.7rem;
        background: var(--panel);
      }
      .filter-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 0.85rem;
        align-items: end;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .filter-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .filter-panel input,
      .filter-panel select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .filter-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      .button-secondary {
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
      }
      .result-count {
        margin: 1.25rem 0 0.65rem;
        color: var(--muted);
      }
      .table-scroll {
        overflow-x: auto;
        border-radius: 18px;
      }
      .table-note {
        max-width: 18rem;
        margin: 0.25rem 0 0;
        overflow-wrap: anywhere;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 250, 242, 0.85);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tr:last-child td { border-bottom: none; }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.9rem;
      }
      .pill-missing {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-unknown {
        background: #e7e8e6;
        color: #566057;
      }
      .detail-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      .detail-list .card p {
        margin: 0.25rem 0;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
      @media (max-width: 720px) {
        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .inventory-totals {
          justify-content: flex-start;
        }
        .filter-panel {
          grid-template-columns: 1fr;
        }
        th, td {
          padding: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hero">
        <h1>kosmos-hub</h1>
        <p class="subtle">Phase 1 registry, onboarding and visibility for managed WordPress sites.</p>
        <nav>
          <a href="/">Dashboard</a>
          <a href="/sites">Sites</a>
          <a href="/healthz">Health</a>
        </nav>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
