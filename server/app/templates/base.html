<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --panel: #fffaf2;
        --ink: #1d2a2f;
        --muted: #6c7469;
        --accent: #0e7c66;
        --accent-soft: #d7efe8;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #fffaf2 0, transparent 25%),
          linear-gradient(180deg, #f9f5ec 0%, var(--bg) 55%, #efe8da 100%);
        color: var(--ink);
      }
      header, main {
        width: min(1540px, calc(100vw - 2rem));
        margin: 0 auto;
      }
      header {
        padding: 2rem 0 1rem;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        margin-right: 1rem;
      }
      h1, h2, h3 {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hero {
        background: rgba(255, 250, 242, 0.75);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(40, 45, 44, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1rem 1.1rem;
      }
      .metric {
        font-size: 2rem;
        margin: 0.4rem 0 0;
      }
      .subtle {
        color: var(--muted);
      }
      .eyebrow {
        margin: 0 0 0.35rem;
        color: var(--accent);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 2rem 0 1rem;
      }
      .section-heading h2 {
        margin: 0;
      }
      .section-heading .subtle {
        margin-bottom: 0;
      }
      .inventory-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.65rem;
        color: var(--muted);
      }
      .inventory-totals span {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 0.7rem;
        background: var(--panel);
      }
      .filter-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 0.85rem;
        align-items: end;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .filter-panel-workbench {
        grid-template-columns: repeat(4, minmax(150px, 1fr));
      }
      .customer-filter-panel {
        grid-template-columns: minmax(260px, 1fr) minmax(220px, 0.75fr) auto;
      }
      .filter-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .filter-panel input,
      .filter-panel select,
      .plan-panel input,
      .plan-panel textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .plan-panel {
        display: grid;
        grid-template-columns: 1.2fr minmax(170px, 0.8fr) minmax(220px, 1fr) auto;
        gap: 0.85rem;
        align-items: end;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .plan-panel p { margin: 0.25rem 0; }
      .plan-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .plan-panel textarea { resize: vertical; }
      .plan-panel-locked { grid-template-columns: 1fr; }
      .workbench-action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
        margin: 1.25rem 0;
      }
      .workbench-action-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1rem;
        min-width: 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .workbench-action-card .filter-actions {
        flex-wrap: wrap;
      }
      .user-workbench-action-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .user-workbench-action-card label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .user-workbench-action-card input,
      .user-workbench-action-card select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .user-workbench-action-card .password-input {
        padding-right: 5rem;
      }
      .bulk-action-warning {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
      }
      .bulk-action-confirmation {
        display: flex !important;
        grid-template-columns: none !important;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .bulk-action-confirmation input {
        width: auto;
        margin-top: 0.2rem;
      }
      .user-workbench-table { min-width: 1160px; }
      .user-workbench-table td:last-child { min-width: 12rem; }
      .user-batch-results { margin: 1.25rem 0; }
      .user-delete-review-table { min-width: 960px; }
      .info-tooltip {
        position: relative;
        display: inline-grid;
        width: 1.2rem;
        height: 1.2rem;
        place-items: center;
        margin-left: 0.25rem;
        padding: 0;
        border: 1px solid var(--accent);
        border-radius: 50%;
        background: var(--panel);
        color: var(--accent);
        cursor: help;
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1;
        vertical-align: text-bottom;
      }
      .info-tooltip-content {
        position: absolute;
        z-index: 10;
        top: calc(100% + 0.45rem);
        left: 0;
        display: none;
        width: min(25rem, calc(100vw - 3rem));
        padding: 0.75rem;
        border: 1px solid #8dbdae;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 12px 28px rgba(40, 45, 44, 0.16);
        color: var(--ink);
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.35;
        text-align: left;
      }
      .info-tooltip:hover .info-tooltip-content,
      .info-tooltip:focus-visible .info-tooltip-content {
        display: block;
      }
      .account-panel {
        max-width: 42rem;
        display: grid;
        gap: 0.9rem;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .account-panel.account-panel-wide { max-width: 72rem; }
      .account-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .account-panel input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .assistant-panel,
      .assistant-answer {
        max-width: 52rem;
        margin: 1.25rem 0;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .assistant-panel {
        display: grid;
        gap: 0.75rem;
      }
      .assistant-panel label {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .assistant-panel textarea {
        width: 100%;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        line-height: 1.45;
        padding: 0.75rem;
      }
      .assistant-panel p,
      .assistant-answer p { margin: 0.25rem 0; }
      .assistant-text {
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .account-panel form {
        display: grid;
        gap: 0.7rem;
      }
      .account-panel .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        align-items: center;
      }
      .account-panel .button-row form { display: block; }
      .account-details {
        display: grid;
        gap: 0.75rem;
        padding-top: 0.2rem;
      }
      .account-details summary {
        color: var(--accent);
        cursor: pointer;
        font-weight: 700;
      }
      .token-value {
        display: block;
        overflow-wrap: anywhere;
        border: 1px solid #8dbdae;
        border-radius: 9px;
        background: var(--accent-soft);
        color: #075f4e;
        padding: 0.75rem;
      }
      .notice-error {
        border-left: 4px solid #a34a2b;
        padding: 0.7rem 0.85rem;
        background: #f7e5db;
        color: #71341f;
      }
      .notice-success {
        border-left: 4px solid var(--accent);
        padding: 0.7rem 0.85rem;
        background: var(--accent-soft);
        color: #075f4e;
      }
      .site-removal-panel {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.25rem;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid #d9b9aa;
        border-radius: 18px;
        background: #fbf0e9;
      }
      .site-removal-panel h3,
      .site-removal-panel p { margin: 0.25rem 0; }
      .site-detail-layout {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        align-items: start;
        gap: 0.75rem;
        margin: 1.5rem 0 2rem;
      }
      .site-detail-content {
        min-width: 0;
      }
      .site-sidebar {
        position: sticky;
        top: 1rem;
        padding: 0.625rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .site-sidebar h2 {
        margin: 0.25rem 0;
        font-size: 1.375rem;
        overflow-wrap: anywhere;
      }
      .site-sidebar .subtle {
        margin: 0.5rem 0 1rem;
      }
      .site-section-nav {
        display: grid;
        gap: 0.35rem;
      }
      .site-section-nav a {
        margin-right: 0;
        padding: 0.65rem 0.75rem;
        border-radius: 10px;
        color: var(--ink);
        font-family: "Trebuchet MS", sans-serif;
        font-weight: 700;
      }
      .site-section-nav a:hover,
      .site-section-nav a:focus-visible {
        background: var(--accent-soft);
        color: #075f4e;
      }
      .site-section-nav a[aria-current="page"] {
        background: var(--accent);
        color: white;
      }
      .site-back-link.button {
        width: 100%;
        margin-top: 1rem;
        text-align: center;
      }
      .site-section {
        scroll-margin-top: 1rem;
      }
      .site-section[hidden] {
        display: none;
      }
      .site-section + .site-section {
        margin-top: 3rem;
      }
      .site-section-heading {
        margin-top: 0;
      }
      .site-dashboard-action,
      .backup-status-card {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.25rem;
        margin-top: 1rem;
      }
      .site-dashboard-action {
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .site-dashboard-action h3,
      .site-dashboard-action p,
      .backup-status-card h3,
      .backup-status-card p {
        margin: 0.25rem 0;
      }
      .backup-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.75rem;
      }
      .user-inventory-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 1.25rem;
        margin: 1rem 0;
      }
      .user-inventory-summary p {
        margin: 0.1rem 0;
      }
      .site-user-create,
      .site-user-actions details {
        margin: 1rem 0;
        padding: 0.8rem 1rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 250, 242, 0.72);
      }
      .site-user-create summary,
      .site-user-actions summary {
        cursor: pointer;
        color: #075f4e;
        font-family: "Trebuchet MS", sans-serif;
        font-weight: 700;
      }
      .site-user-form {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        margin-top: 0.9rem;
      }
      .site-user-form label {
        display: grid;
        gap: 0.3rem;
        color: var(--ink);
        font-size: 0.9rem;
      }
      .site-user-form input,
      .site-user-form select {
        width: 100%;
      }
      .site-user-form-actions {
        display: flex;
        align-items: end;
        flex-wrap: wrap;
        gap: 0.55rem;
        grid-column: 1 / -1;
      }
      .password-input-with-copy {
        position: relative;
        display: block;
      }
      .password-input-with-copy .password-input {
        padding-right: 5rem;
      }
      .copy-password-icon,
      .generate-password-icon {
        position: absolute;
        top: 50%;
        right: 0.35rem;
        display: inline-grid;
        width: 2rem;
        height: 2rem;
        place-items: center;
        padding: 0;
        transform: translateY(-50%);
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #076c58;
        cursor: pointer;
      }
      .generate-password-icon {
        right: 2.65rem;
      }
      .copy-password-icon:hover,
      .copy-password-icon:focus-visible,
      .copy-password-icon.is-copied,
      .generate-password-icon:hover,
      .generate-password-icon:focus-visible {
        background: rgba(215, 239, 232, 0.78);
      }
      .copy-password-icon svg,
      .generate-password-icon svg {
        width: 1rem;
        height: 1rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
      }
      .site-user-form.compact {
        grid-template-columns: 1fr;
      }
      .site-user-form.compact .password-input-with-copy,
      .site-user-delete input:not([type="hidden"]),
      .site-user-delete select {
        width: 14.25rem;
        max-width: 100%;
      }
      .site-user-delete .button-danger {
        width: 14rem;
        max-width: 100%;
      }
      .site-users-table th:nth-child(5),
      .site-users-table td:nth-child(5) {
        width: 8.5rem;
      }
      .site-users-table th:last-child,
      .site-users-table td:last-child {
        width: 23rem;
      }
      .site-user-actions {
        min-width: 23rem;
      }
      .site-user-actions details {
        margin: 0 0 0.5rem;
      }
      .site-user-delete {
        background: #fff4ef !important;
      }
      .active-update-status {
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid #8dbdae;
        border-radius: 18px;
        background: rgba(215, 239, 232, 0.48);
      }
      .active-update-status h3,
      .active-update-status p {
        margin: 0.25rem 0;
      }
      .active-update-status .table-scroll {
        margin-top: 0.85rem;
      }
      .site-update-panel {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      button.button.button-danger {
        background: #a34a2b;
        color: white;
      }
      .filter-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      button.button {
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
      button.button.button-secondary {
        background: transparent;
        color: var(--accent);
      }
      .button-secondary {
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
      }
      .result-count {
        margin: 1.25rem 0 0.65rem;
        color: var(--muted);
      }
      .table-scroll {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        border-radius: 18px;
      }
      .update-workbench-table {
        min-width: 1320px;
      }
      .select-all-control {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }
      .table-note {
        max-width: 18rem;
        margin: 0.25rem 0 0;
        overflow-wrap: anywhere;
      }
      .inline-form { margin-top: 0.65rem; }
      .inline-form .button { padding: 0.55rem 0.8rem; }
      .customer-directory-table { min-width: 970px; }

      .fleet-refresh-progress {
        width: 100%;
        height: 0.75rem;
        margin: 0.75rem 0 0;
        accent-color: var(--accent);
      }

      .fleet-refresh-progress-details {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 250, 242, 0.85);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 0.5rem 0.625rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tr:last-child td { border-bottom: none; }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.9rem;
      }
      .pill-missing {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-unknown {
        background: #e7e8e6;
        color: #566057;
      }
      .pill-wordpress {
        background: #f2dfd2;
        color: #8a3f25;
      }
      .pill-plugin,
      .pill-active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .pill-theme,
      .pill-system {
        background: #e7e8e6;
        color: #566057;
      }
      .pill-inactive {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-postflight_failed {
        background: #f7e5db;
        color: #71341f;
      }
      .pill-running,
      .pill-waiting {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-succeeded {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .pill-failed {
        background: #f7e5db;
        color: #71341f;
      }
      .postflight-card .notice-success,
      .postflight-card .notice-error {
        margin: 0.75rem 0;
      }
      .detail-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      .detail-list .card p {
        margin: 0.25rem 0;
      }
      .capability-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
        margin: 0.75rem 0;
      }
      .capability-summary p {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        margin: 0 !important;
        padding: 0.55rem 0.6rem;
        border-radius: 12px;
        background: var(--accent-soft);
      }
      .capability-summary strong {
        color: var(--accent);
        font-size: 1.15rem;
      }
      .capability-summary span {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .capability-details {
        margin-top: 0.85rem;
      }
      .capability-details summary {
        color: var(--accent);
        cursor: pointer;
        font-weight: 700;
      }
      .capability-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.75rem;
      }
      .capability-tag {
        max-width: 100%;
        overflow: hidden;
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--paper);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        overflow-wrap: anywhere;
      }
      .maintenance-history {
        margin-top: 0;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
      a.button.button-secondary {
        background: transparent;
        color: var(--accent);
      }
      @media (max-width: 720px) {
        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .inventory-totals {
          justify-content: flex-start;
        }
        .filter-panel {
          grid-template-columns: 1fr;
        }
        .plan-panel {
          grid-template-columns: 1fr;
        }
        .workbench-action-grid {
          grid-template-columns: 1fr;
        }
        .site-detail-layout {
          grid-template-columns: 1fr;
        }
        .site-sidebar {
          position: static;
        }
        .site-section-nav {
