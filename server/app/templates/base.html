<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --font-body: {{ styling.font_family }};
        --bg: {{ styling.background_color }};
        --bg-end: {{ styling.background_secondary_color }};
        --panel: {{ styling.panel_color }};
        --ink: {{ styling.ink_color }};
        --muted: {{ styling.muted_color }};
        --accent: {{ styling.accent_color }};
        --accent-soft: {{ styling.accent_soft_color }};
        --border: {{ styling.border_color }};
        --space-base: {{ styling.base_spacing }}px;
        --radius-panel: {{ styling.panel_radius }}px;
        --control-v1-height: {{ styling.control_v1_height }}px;
        --control-v1-font-size: {{ styling.control_v1_font_size }}px;
        --control-v1-padding: {{ styling.control_v1_padding }}px;
        --control-v1-radius: {{ styling.control_v1_radius }}px;
        --control-v2-height: {{ styling.control_v2_height }}px;
        --control-v2-font-size: {{ styling.control_v2_font_size }}px;
        --control-v2-padding: {{ styling.control_v2_padding }}px;
        --control-v2-radius: {{ styling.control_v2_radius }}px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-end) 100%);
        color: var(--ink);
      }
      .app-shell {
        display: grid;
        grid-template-columns: 14.25rem minmax(0, 1fr);
        min-height: 100vh;
        width: 100%;
      }
      .app-sidebar {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        align-self: start;
        min-width: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 1.4rem 1rem;
        border-right: 1px solid var(--border);
        background:
          linear-gradient(180deg, rgba(255, 253, 248, 0.96), rgba(245, 241, 232, 0.92)),
          var(--panel);
        box-shadow: 14px 0 35px rgba(40, 45, 44, 0.045);
      }
      .app-brand {
        padding: 0.25rem 0.45rem 1.4rem;
        border-bottom: 1px solid var(--border);
      }
      .app-brand h1 {
        margin: 0;
        color: #102a32;
        font-size: 1.8rem;
      }
      .app-brand .subtle {
        margin: 0.65rem 0 0;
        font-size: 0.88rem;
        line-height: 1.35;
      }
      .app-email-alert {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        margin: 1rem 0.2rem 0;
        padding: 0.6rem 0.7rem;
        border: 1px solid var(--accent);
        border-radius: 9px;
        background: var(--accent-soft);
        color: #075f4e;
        font: 700 0.84rem "Trebuchet MS", sans-serif;
        text-decoration: none;
      }
      .app-email-alert:hover,
      .app-email-alert:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .app-email-alert-count {
        display: inline-grid;
        min-width: 1.45rem;
        height: 1.45rem;
        place-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.75rem;
      }
      .app-navigation {
        display: grid;
        gap: 0.2rem;
        padding: 1.1rem 0.2rem 1.5rem;
      }
      .app-navigation a {
        color: var(--ink);
        text-decoration: none;
        border-radius: 9px;
        padding: 0.62rem 0.7rem;
        font: 700 0.84rem "Trebuchet MS", sans-serif;
        line-height: 1.2;
      }
      .app-navigation a:hover,
      .app-navigation a:focus-visible,
      .app-navigation a.is-active {
        color: #075f4e;
        background: var(--accent-soft);
      }
      .app-main {
        width: 100%;
        min-width: 0;
        padding: 1.65rem clamp(1rem, 2vw, 2.5rem) 2.5rem;
      }
      h1, h2, h3 {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hero {
        background: rgba(255, 250, 242, 0.75);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(40, 45, 44, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: var(--space-base);
        margin: 1.5rem 0 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        padding: var(--space-base);
      }
      .metric {
        font-size: 2rem;
        margin: 0.4rem 0 0;
      }
      .subtle {
        color: var(--muted);
      }
      .eyebrow {
        margin: 0 0 0.35rem;
        color: var(--accent);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 2rem 0 1rem;
      }
      .section-heading h2 {
        margin: 0;
      }
      .section-heading .subtle {
        margin-bottom: 0;
      }
      .inventory-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.65rem;
        color: var(--muted);
      }
      .inventory-totals span {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 0.7rem;
        background: var(--panel);
      }
      .filter-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 0.85rem;
        align-items: end;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        background: rgba(255, 250, 242, 0.72);
      }
      .filter-panel-workbench {
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        margin-top: 100px;
        padding: 10px 15px;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
      .filter-panel-update-workbench { margin-top: 100px; }
      .filter-panel .user-workbench-filter-summary {
        grid-column: 1 / -1;
        margin: 0;
      }
      .workbench-page-layout {
        display: grid;
        grid-template-columns: 17.5rem minmax(0, 1fr);
        align-items: start;
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .workbench-page-main {
        min-width: 0;
      }
      .workbench-page-main .section-heading {
        margin-top: 0;
      }
      .workbench-site-selector {
        position: sticky;
        top: 1rem;
        padding: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .workbench-site-selector form {
        display: grid;
        gap: 0.8rem;
      }
      .site-selector-heading h3 {
        margin: 0;
      }
      .site-selector-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.25rem;
      }
      .site-selector-tab {
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: 700 0.78rem "Trebuchet MS", sans-serif;
        padding: 0.5rem 0.35rem;
      }
      .site-selector-tab:hover,
      .site-selector-tab:focus-visible,
      .site-selector-tab.is-active {
        background: var(--accent-soft);
        color: #075f4e;
      }
      .site-selector-search input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .site-selector-selection-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.45rem;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .site-selector-selection-tools button {
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0;
      }
      .site-selector-selection-tools strong {
        color: var(--accent);
        white-space: nowrap;
      }
      .site-selector-list {
        display: grid;
        max-height: min(39vh, 23.25rem);
        gap: 0.05rem;
        overflow: auto;
        padding-right: 0.2rem;
      }
      .site-selector-list[hidden] { display: none; }
      .site-selector-row {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.43rem 0.25rem;
        border-radius: 8px;
        color: var(--ink);
        cursor: pointer;
        font-size: 0.88rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .site-selector-row:hover { background: rgba(215, 239, 232, 0.6); }
      .site-selector-row input { flex: 0 0 auto; margin: 0.14rem 0 0; accent-color: var(--accent); }
      .site-selector-row small {
        display: block;
        margin-top: 0.1rem;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .site-selector-submit-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.5rem;
        margin-top: 0.15rem;
      }
      .site-selector-submit {
        width: auto;
        margin: 0;
        min-width: 5.25rem;
      }
      .site-selector-submit:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: saturate(0.55);
      }
      .site-selector-submit-actions select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        padding: 0.58rem 0.65rem;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .customer-filter-panel {
        grid-template-columns: minmax(260px, 1fr) minmax(180px, 0.55fr) minmax(220px, 0.75fr) auto;
      }
      .customer-search-input {
        display: block;
        position: relative;
      }
      .customer-search-input input { padding-right: 3rem; }
      .customer-filter-search-submit {
        position: absolute;
        top: 50%;
        right: 0.35rem;
        display: inline-grid;
        width: 2rem;
        height: 2rem;
        place-items: center;
        padding: 0;
        transform: translateY(-50%);
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #076c58;
        cursor: pointer;
      }
      .customer-filter-search-submit:hover,
      .customer-filter-search-submit:focus-visible { background: rgba(215, 239, 232, 0.78); }
      .customer-filter-search-submit svg {
        width: 1rem;
        height: 1rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
      }
      .filter-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .filter-panel input,
      .filter-panel select,
      .plan-panel input,
      .plan-panel textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .plan-panel {
        display: grid;
        grid-template-columns: 1.2fr minmax(170px, 0.8fr) minmax(220px, 1fr) auto;
        gap: 0.85rem;
        align-items: end;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .plan-panel p { margin: 0.25rem 0; }
      .plan-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .plan-panel textarea { resize: vertical; }
      .plan-panel-locked { grid-template-columns: 1fr; }
      .workbench-action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
        margin: 1.25rem 0;
      }
      .workbench-action-panel {
        display: grid;
        grid-template-columns: minmax(240px, 0.9fr) minmax(180px, 1fr) auto;
        align-items: end;
        gap: 0.75rem 1rem;
        margin: 1rem 0;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 250, 242, 0.72);
      }
      .workbench-action-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .workbench-action-panel [data-site-selector-target-sites] { display: contents; }
      .workbench-action-panel select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .workbench-action-panel .subtle { margin: 0 0 0.2rem; }
      .workbench-action-panel .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .direct-update-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 1rem;
        margin: 1.25rem 0 2.5rem;
      }
      .direct-update-controls .subtle { margin: 0; }
      .direct-update-controls .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .update-action-launch { margin: 1rem 0; }
      .update-action-launch-controls {
        display: flex;
        align-items: end;
        justify-content: flex-start;
        gap: 0.9rem;
        margin-top: 20px;
      }
      .update-action-launch-controls label {
        display: grid;
        flex: 0 1 300px;
        width: 300px;
        max-width: 100%;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .update-action-launch-controls select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .update-action-launch-controls .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .update-action-explanation {
        margin-top: 1rem;
        padding-top: 0.95rem;
        border-top: 1px solid var(--border);
      }
      .update-action-explanation .eyebrow { margin: 0 0 0.35rem; }
      .update-action-explanation h3 { margin: 0; }
      .update-action-explanation .subtle { margin: 0.55rem 0 0; }
      .update-confirmation-dialog {
        width: min(31rem, calc(100vw - 2rem));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.25rem;
        color: var(--ink);
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(29, 42, 47, 0.2);
      }
      .update-confirmation-dialog::backdrop { background: rgba(29, 42, 47, 0.32); }
      .update-confirmation-dialog h3 { margin: 0; }
      .update-confirmation-dialog p { margin: 0.75rem 0 1.15rem; }
      .update-confirmation-dialog .dialog-selection-heading {
        margin: 0 0 0.35rem;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
      }
      .update-confirmation-list {
        max-height: 13rem;
        margin: 0 0 1.15rem;
        padding: 0;
        overflow-y: auto;
        border-top: 1px solid var(--border);
        list-style: none;
      }
      .update-confirmation-list li {
        display: grid;
        gap: 0.15rem;
        padding: 0.6rem 0;
        border-bottom: 1px solid var(--border);
      }
      .update-confirmation-list span { color: var(--muted); font-size: 0.9rem; }
      .update-confirmation-safeguard { margin: 0 0 1.15rem; }
      .update-confirmation-safeguard label { display: grid; gap: 0.45rem; font-weight: 700; }
      .update-confirmation-safeguard input { width: 100%; }
      .update-confirmation-safeguard .subtle { margin: 0.35rem 0 0; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 0.65rem; }
      .fleet-refresh-status-card {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #8dbdae;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(232, 246, 240, 0.88), rgba(255, 250, 242, 0.9));
      }
      .fleet-refresh-status-card .section-heading { margin-bottom: 0.75rem; }
      .fleet-refresh-status-card h3 { display: flex; align-items: center; gap: 0.55rem; }
      .fleet-refresh-progress-track {
        height: 1.4rem;
        overflow: hidden;
        border-radius: 2px;
        background: #d7e6df;
      }
      .fleet-refresh-progress-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #087f6b, #33a88d);
        transition: width 260ms ease;
      }
      .fleet-refresh-progress-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin-top: 0.7rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .fleet-refresh-progress-meta strong { color: var(--ink); }
      .fleet-refresh-status-card [data-refresh-summary] { margin: 0.75rem 0 0; }
      .fleet-refresh-status-card [data-refresh-complete] {
        margin: 0.75rem 0 0;
        border-left: 0;
        padding-left: 0;
        padding-right: 0;
        background: transparent;
      }
      .fleet-refresh-cancel-form {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.85rem;
      }
      .fleet-refresh-cancel-form .button { min-width: 7rem; }
      .direct-update-status-card {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #8dbdae;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(232, 246, 240, 0.88), rgba(255, 250, 242, 0.9));
      }
      .direct-update-status-card .section-heading { margin-bottom: 0.75rem; }
      .direct-update-cancel-form { margin: 0; }
      .direct-update-cancel-form .button { min-width: 7rem; }
      .direct-update-progress-track {
        height: 1.4rem;
        overflow: hidden;
        border-radius: 2px;
        background: #d7e6df;
      }
      .direct-update-progress-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #087f6b, #33a88d);
        transition: width 260ms ease;
      }
      .direct-update-run-table { min-width: 680px; }
      .direct-update-run-table th,
      .direct-update-run-table td { vertical-align: middle; }
      .direct-update-run-table td:nth-child(2) {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .complete-site-update-status-card {
        width: 100%;
        margin-top: 1.25rem;
      }
      .complete-site-update-status-card .section-heading > div:first-child {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
      }
      .complete-site-update-progress-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin: 0.75rem 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .complete-site-update-status-card .direct-update-run-table td:nth-child(2) { display: table-cell; }
      .direct-update-status {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .direct-update-status-icon {
        display: inline-block;
        box-sizing: border-box;
        width: 1rem;
        height: 1rem;
        flex: 0 0 1rem;
      }
      .direct-update-status-icon.is-processing {
        border: 2px solid #9dcfc1;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: direct-update-spin 0.8s linear infinite;
      }
      .direct-update-status-icon.is-succeeded {
        width: 0.55rem;
        height: 0.9rem;
        margin: 0 0.2rem;
        border-right: 2px solid var(--accent);
        border-bottom: 2px solid var(--accent);
        transform: rotate(45deg) translateY(-0.1rem);
      }
      .direct-update-status-icon.is-failed {
        border: 2px solid #b64c2d;
        border-radius: 50%;
      }
      .direct-update-status-icon.is-failed::after {
        content: "";
        display: block;
        width: 2px;
        height: 0.45rem;
        margin: 0.12rem auto 0;
        background: #b64c2d;
        box-shadow: 0 0.53rem 0 -0.03rem #b64c2d;
      }
      .direct-update-status-icon.is-skipped,
      .direct-update-status-icon.is-queued {
        height: 2px;
        margin-top: 0.05rem;
        background: var(--muted);
      }
      @keyframes direct-update-spin { to { transform: rotate(360deg); } }
      .plugin-install-form {
        margin: 1rem 0 1.25rem;
      }
      .plugin-source-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .plugin-source-tab {
        width: 100%;
        padding: 0.72rem 1rem;
        border: 1px solid var(--accent);
        border-radius: 12px;
        background: transparent;
        color: #075f4e;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      .plugin-source-tab.is-active {
        background: var(--accent);
        color: #fff;
      }
      .plugin-source-panel {
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .plugin-catalog-controls {
        display: grid;
        grid-template-columns: calc(50% - 0.375rem) minmax(0, 1fr);
        align-items: end;
        gap: 0.75rem;
      }
      .plugin-catalog-controls label,
      .plugin-zip-upload,
      .plugin-install-options {
        display: grid;
        gap: 0.45rem;
        margin: 0;
        border: 0;
        padding: 0;
      }
      .plugin-catalog-controls label > span,
      .plugin-zip-upload > span,

          border-bottom: 1px solid var(--border);
          box-shadow: 0 8px 20px rgba(40, 45, 44, 0.035);
        }
        .app-brand {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1rem;
          padding: 0 0.35rem 0.75rem;
        }
        .app-brand h1 { font-size: 1.45rem; }
        .app-brand .subtle {
          max-width: 27rem;
          margin: 0;
          text-align: right;
        }
        .app-navigation {
          display: flex;
          gap: 0.3rem;
          overflow-x: auto;
          padding: 0.7rem 0.15rem 0.05rem;
          scrollbar-width: thin;
        }
        .app-navigation a {
          flex: 0 0 auto;
          padding: 0.52rem 0.62rem;
          white-space: nowrap;
        }
        .app-main { padding: 1.15rem 1rem 2rem; }
      }
      .capability-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
        margin: 0.75rem 0;
      }
      .capability-summary p {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        margin: 0 !important;
        padding: 0.55rem 0.6rem;
        border-radius: 12px;
        background: var(--accent-soft);
      }
      .capability-summary strong {
        color: var(--accent);
        font-size: 1.15rem;
      }
      .capability-summary span {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .capability-details {
        margin-top: 0.85rem;
      }
      .capability-details summary {
        color: var(--accent);
        cursor: pointer;
        font-weight: 700;
      }
      .capability-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.75rem;
      }
      .capability-tag {
        max-width: 100%;
        overflow: hidden;
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--paper);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        overflow-wrap: anywhere;
      }
      .maintenance-history {
        width: 100%;
        margin-top: 3.75rem;
      }
      .maintenance-history .section-heading > div {
        width: 100%;
      }
      .maintenance-history-list {
        display: grid;
        gap: 0.55rem;
        margin-top: 1rem;
      }
      .maintenance-history-entry {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 250, 242, 0.72);
      }
      .maintenance-history-entry-complete > summary {
        border-radius: 13px;
        background: linear-gradient(90deg, rgba(217, 239, 232, 0.72), rgba(255, 250, 242, 0.86));
      }
      .maintenance-history-entry-complete[open] > summary {
        border-radius: 13px 13px 0 0;
      }
      .maintenance-history-entry > summary {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.75rem;
        cursor: pointer;
        list-style: none;
        padding: 0.78rem 0.9rem;
      }
      .maintenance-history-entry > summary::-webkit-details-marker { display: none; }
      .maintenance-history-entry > summary::before {
        content: "+";
        display: grid;
        width: 1.3rem;
        height: 1.3rem;
        place-items: center;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 800;
      }
      .maintenance-history-entry[open] > summary::before { content: "-"; }
      .maintenance-history-entry > summary:focus-visible {
        outline: 3px solid rgba(13, 135, 112, 0.35);
        outline-offset: -3px;
      }
      .maintenance-history-entry-id {
        color: var(--accent);
        font: 700 0.78rem "IBM Plex Mono", monospace;
      }
      .maintenance-history-entry-kind { font-weight: 700; }
      .maintenance-history-entry-time {
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .maintenance-history-entry-content {
        border-top: 1px solid var(--border);
        padding: 0.9rem;
      }
      .maintenance-history-entry-details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem 1.2rem;
        margin: 0;
      }
      .maintenance-history-entry-details div { min-width: 0; }
      .maintenance-history-entry-details dt {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      .maintenance-history-entry-details dd {
        display: grid;
        gap: 0.15rem;
        margin: 0.22rem 0 0;
      }
      .maintenance-history-entry-result { grid-column: 1 / -1; }
      .maintenance-history-child-updates {
        margin-top: 1rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--border);
      }
      .maintenance-history-child-updates h3 {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0 0 0.65rem;
        font-size: 0.95rem;
      }
      .maintenance-history-child-updates h3 span {
        display: inline-grid;
        min-width: 1.45rem;
        place-items: center;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.74rem;
      }
      .maintenance-history-child-row {
        background: rgba(217, 239, 232, 0.34);
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        background: var(--accent);
        color: white;
        text-decoration: none;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
      a.button.button-secondary {
        background: transparent;
        color: var(--accent);
      }
      .control-variant-1,
      .button-variant-1 {
        --hub-control-height: var(--control-v1-height);
        --hub-control-font-size: var(--control-v1-font-size);
        --hub-control-padding: var(--control-v1-padding);
        --hub-control-radius: var(--control-v1-radius);
      }
      .control-variant-2,
      .button-variant-2 {
        --hub-control-height: var(--control-v2-height);
        --hub-control-font-size: var(--control-v2-font-size);
        --hub-control-padding: var(--control-v2-padding);
        --hub-control-radius: var(--control-v2-radius);
      }
      input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="file"]):not([type="color"]):not([type="range"]),
      select:not([multiple]),
      button.button,
      a.button {
        height: var(--hub-control-height, var(--control-v1-height));
        padding: 0 var(--hub-control-padding, var(--control-v1-padding));
        border-radius: var(--hub-control-radius, var(--control-v1-radius));
        font-size: var(--hub-control-font-size, var(--control-v1-font-size));
        line-height: 1.2;
      }
      textarea {
        min-height: var(--hub-control-height, var(--control-v1-height));
        padding: var(--hub-control-padding, var(--control-v1-padding));
        border-radius: var(--hub-control-radius, var(--control-v1-radius));
        font-size: var(--hub-control-font-size, var(--control-v1-font-size));
      }
      .email-rich-editor-toolbar {
        --hub-control-height: var(--control-v2-height);
        --hub-control-font-size: var(--control-v2-font-size);
        --hub-control-padding: var(--control-v2-padding);
        --hub-control-radius: var(--control-v2-radius);
      }
      .email-rich-editor-toolbar button,
      .email-rich-editor-toolbar select,
      .email-rich-editor-toolbar input {
        height: var(--hub-control-height);
        border-radius: var(--hub-control-radius);
        font-size: var(--hub-control-font-size);
      }
      .styling-page-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(13.5rem, 16rem);
        align-items: start;
        gap: calc(var(--space-base) * 1.25);
        margin: 1.5rem 0 2.5rem;
      }
      .styling-settings-form { display: grid; gap: var(--space-base); }
      .styling-panel,
      .styling-reference {
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        background: rgba(255, 250, 242, 0.8);
        padding: calc(var(--space-base) * 1.15);
      }
      .styling-panel { display: grid; gap: var(--space-base); }
      .styling-panel-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: var(--space-base);
      }
      .styling-panel-heading h3,
      .styling-reference h3 { margin: 0; }
      .styling-panel-heading .subtle { margin: 0; max-width: 23rem; }
      .styling-settings-grid {
        display: grid;
        gap: calc(var(--space-base) * 0.75);
      }
      .styling-settings-grid-foundation { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .styling-settings-grid-variant { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .styling-settings-grid label,
      .styling-color-field {
        display: grid;
        gap: 0.35rem;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .styling-settings-grid input,
      .styling-settings-grid select { width: 100%; }
      .styling-color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: calc(var(--space-base) * 0.75);
      }
      .styling-color-field > span {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }
      .styling-color-field input[type="color"] {
        width: 2.6rem;
        height: var(--control-v1-height);
        padding: 0.2rem;
        border: 1px solid var(--border);
        border-radius: var(--control-v1-radius);
        background: var(--panel);
      }
      .styling-color-field output {
        color: var(--ink);
        font-family: "Courier New", monospace;
        font-size: 0.78rem;
      }
      .styling-component-preview {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: calc(var(--space-base) * 0.65);
        padding-top: var(--space-base);
        border-top: 1px solid var(--border);
      }
      .styling-component-preview input,
      .styling-component-preview select { width: min(100%, 14rem); }
      .styling-save-row { display: flex; justify-content: flex-end; }
      .styling-reference {
        position: sticky;
        top: 1rem;
        display: grid;
        gap: 0.7rem;
      }
      .styling-reference .eyebrow,
      .styling-reference .subtle { margin: 0; }
      .styling-reference code {
        width: fit-content;
        padding: 0.3rem 0.45rem;
        border-radius: var(--control-v2-radius);
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 0.78rem;
      }
      @media (max-width: 720px) {
        .app-brand .subtle { display: none; }
        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .inventory-totals {
          justify-content: flex-start;
        }
        .filter-panel {
          grid-template-columns: 1fr;
        }
        .customer-fields-grid { grid-template-columns: 1fr; }
        .styling-page-layout { grid-template-columns: 1fr; }
        .styling-settings-grid-foundation,
        .styling-settings-grid-variant { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .styling-panel-heading { align-items: flex-start; flex-direction: column; }
        .styling-reference { position: static; }
        .filter-panel-workbench {
          margin-top: 2.5rem;
        }
        .filter-panel-update-workbench { margin-top: 2.5rem; }
        .plan-panel {
          grid-template-columns: 1fr;
        }
        .workbench-action-grid {
          grid-template-columns: 1fr;
        }
        .workbench-action-panel { grid-template-columns: 1fr; }
        .direct-update-controls,
        .update-action-launch-controls { align-items: stretch; flex-direction: column; }
        .update-action-launch-controls label { flex-basis: auto; width: 100%; }
        .update-action-launch-controls .button { width: 100%; }
        .plugin-source-tabs,
        .plugin-catalog-controls { grid-template-columns: 1fr; }
        .plugin-catalog-selection { align-items: stretch; flex-direction: column; }
        .plugin-catalog-selection .button { width: 100%; }
        .plugin-catalog-pagination,
        .plugin-install-dialog-actions { align-items: stretch; flex-direction: column; }
        .plugin-catalog-pagination .button,
        .plugin-install-dialog-actions .button { width: 100%; }
        .user-workbench-create form {
          grid-template-columns: 1fr;
        }
        .user-workbench-action-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .user-workbench-bulk-action form[data-user-action-kind="password"] > label {
          width: 100%;
        }
        .workbench-page-layout {
          grid-template-columns: 1fr;
          margin-top: 1rem;
        }
        .account-page-layout {
          grid-template-columns: 1fr;
          gap: 0.75rem;
          margin-top: 1rem;
        }
        .account-page-sidebar { position: static; }
        .account-section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .account-panel .zoho-credentials-form { grid-template-columns: 1fr; }
        .zoho-connection-status { align-items: flex-start; flex-direction: column; }
        .zoho-import-row { grid-template-columns: 1fr; }
        .zoho-credentials-form .zoho-data-center-field,
        .zoho-credentials-form .zoho-client-id-field,
        .zoho-credentials-form .zoho-client-secret-field,
        .zoho-credentials-form .zoho-save-credentials {
          grid-column: auto;
          grid-row: auto;
        }
        .account-panel .fleet-refresh-settings-form { grid-template-columns: 1fr; }
        .workbench-site-selector {
          position: static;
        }
        .site-selector-list { max-height: 14.25rem; }
        .site-detail-layout {
          grid-template-columns: 1fr;
        }
        .site-sidebar {
          position: static;
        }
        .site-section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .maintenance-history-entry > summary {
          grid-template-columns: auto auto minmax(0, 1fr);
        }
        .maintenance-history-entry-time {
          grid-column: 2 / -1;
          white-space: normal;
        }
        .maintenance-history-entry-details {
          grid-template-columns: 1fr;
        }
        .site-user-form {
          grid-template-columns: 1fr;
        }
        .site-dashboard-action,
        .backup-status-card {
          align-items: flex-start;
          flex-direction: column;
        }
        .backup-actions {
          justify-content: flex-start;
        }
        .site-update-panel {
          grid-template-columns: 1fr;
        }
        .site-removal-panel {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="Hauptnavigation">
        <div class="app-brand">
        <h1>kosmos-hub</h1>
        <p class="subtle">Phase 1 registry, onboarding and visibility for managed WordPress sites.</p>
        </div>
          <a class="app-email-alert" href="/emails?folder=inbox&amp;unread=true" data-unread-email-alert aria-label="{{ unread_email_count }} ungelesene E-Mails anzeigen"{% if not unread_email_count %} hidden{% endif %}>
            <span>Neue E-Mails</span>
            <strong class="app-email-alert-count" data-unread-email-count>{{ unread_email_count }}</strong>
          </a>
        <nav class="app-navigation" aria-label="Bereiche">
          <a href="/"{% if request.url.path == "/" %} class="is-active"{% endif %}>Dashboard</a>
          <a href="/sites"{% if request.url.path.startswith("/sites") %} class="is-active"{% endif %}>Sites</a>
          <a href="/customers"{% if request.url.path.startswith("/customers") %} class="is-active"{% endif %}>Customers</a>
          <a href="/emails"{% if request.url.path.startswith("/emails") %} class="is-active"{% endif %}>E-Mails</a>
          <a href="/users"{% if request.url.path.startswith("/users") %} class="is-active"{% endif %}>Users</a>
          <a href="/backups"{% if request.url.path.startswith("/backups") %} class="is-active"{% endif %}>Backups</a>
          <a href="/updates"{% if request.url.path.startswith("/updates") %} class="is-active"{% endif %}>Update workbench</a>
          <a href="/plugin-installations"{% if request.url.path.startswith("/plugin-installations") %} class="is-active"{% endif %}>Plugin installation</a>
          <a href="/update-plans"{% if request.url.path.startswith("/update-plans") %} class="is-active"{% endif %}>Plans</a>
          <a href="/assistant"{% if request.url.path.startswith("/assistant") %} class="is-active"{% endif %}>Assistant</a>
          <a href="/account"{% if request.url.path.startswith("/account") %} class="is-active"{% endif %}>Account</a>
          <a href="/styling"{% if request.url.path.startswith("/styling") %} class="is-active"{% endif %}>Styling</a>
          <a href="/healthz">Health</a>
        </nav>
      </aside>
      <main class="app-main">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      (function () {
        var adminIconPaths = [
          "M4 21h16", "M6 21V4a1 1 0 0 1 1-1h8l3 3v15", "M14 3v4h4", "M11 12h8", "m16 8 4 4-4 4"
        ];
        var homeIconPaths = ["m3 11 9-8 9 8", "M5 10v10h14V10", "M9 20v-6h6v6"];

        function icon(paths) {
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          paths.forEach(function (pathData) {
            var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            svg.appendChild(path);
          });
          return svg;
        }

        function disabledAction(paths, title) {
          var action = document.createElement("span");
          action.className = "site-quick-action is-disabled";
          action.setAttribute("aria-disabled", "true");
          action.title = title;
          action.appendChild(icon(paths));
          return action;
        }

        function appendSiteDomainLink(container, site) {
          var primary = document.createElement("div");
          primary.className = "site-domain-primary";
          var actions = document.createElement("div");
          actions.className = "site-quick-actions";

          if (site.adminLaunchSupported) {
            var adminButton = document.createElement("button");
            adminButton.className = "site-quick-action";
            adminButton.type = "button";
            adminButton.dataset.wordpressAdminLaunch = "";
            adminButton.dataset.siteId = String(site.id);
            adminButton.dataset.csrfToken = site.csrfToken || "";
            adminButton.setAttribute("aria-label", "WordPress-Backend von " + site.domain + " öffnen");
            adminButton.title = "WordPress-Backend öffnen";
            adminButton.appendChild(icon(adminIconPaths));
            actions.appendChild(adminButton);
          } else {
            actions.appendChild(disabledAction(adminIconPaths, "Kosmos Bridge 0.3.62 oder neuer erforderlich"));
          }

          if (site.homeUrl) {
            var homeLink = document.createElement("a");
            homeLink.className = "site-quick-action";
            homeLink.href = site.homeUrl;
            homeLink.target = "_blank";
            homeLink.rel = "noopener noreferrer";
            homeLink.setAttribute("aria-label", "Startseite von " + site.domain + " öffnen");
            homeLink.title = "Startseite öffnen";
            homeLink.appendChild(icon(homeIconPaths));
            actions.appendChild(homeLink);
          } else {
            actions.appendChild(disabledAction(homeIconPaths, "Keine Startseite gespeichert"));
          }

          var domainLink = document.createElement("a");
          domainLink.href = "/sites/" + site.id;
          domainLink.textContent = site.domain;
          primary.appendChild(actions);
          primary.appendChild(domainLink);
          container.appendChild(primary);
        }

        window.kosmosSiteDomainLinks = { append: appendSiteDomainLink };

        document.addEventListener("toggle", function (event) {
          var details = event.target;
          if (!(details instanceof HTMLDetailsElement) || !details.open || !details.hasAttribute("data-email-preview")) { return; }
          if (details.dataset.emailUnread === "true" && details.dataset.emailReadUrl && details.dataset.emailReadCsrf) {
            window.fetch(details.dataset.emailReadUrl, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ csrf_token: details.dataset.emailReadCsrf }).toString(),
              credentials: "same-origin"
            }).then(function (response) {
              if (!response.ok) { return; }
              details.dataset.emailUnread = "false";
              var counter = document.querySelector("[data-unread-email-count]");
              var alert = document.querySelector("[data-unread-email-alert]");
              if (!counter || !alert) { return; }
              var remaining = Math.max(0, Number(counter.textContent || "0") - 1);
              if (remaining) {
                counter.textContent = String(remaining);
                alert.setAttribute("aria-label", remaining + " ungelesene E-Mails anzeigen");
              } else {
                alert.remove();
              }
            });
          }
          var frame = details.querySelector("[data-email-preview-frame]");
          if (!frame || frame.srcdoc) { return; }
          frame.srcdoc = frame.dataset.srcdoc || "";
          frame.removeAttribute("data-srcdoc");
        }, true);

        document.addEventListener("click", function (event) {
          var button = event.target.closest("[data-wordpress-admin-launch]");
          if (!button) { return; }
          event.preventDefault();
          var siteId = button.dataset.siteId || "";
          var csrfToken = button.dataset.csrfToken || "";
          if (!/^\d+$/.test(siteId) || !csrfToken) { return; }

          var form = document.createElement("form");
          form.method = "post";
          form.action = "/sites/" + siteId + "/open-wordpress-admin";
          form.target = "_blank";
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = "csrf_token";
          input.value = csrfToken;
          form.appendChild(input);
          document.body.appendChild(form);
          form.submit();
          form.remove();
        });

        var emailComposerLayer = document.querySelector("[data-email-compose-layer]");
        if (emailComposerLayer) {
          var emailComposerDrawer = emailComposerLayer.querySelector("[data-email-compose-drawer]");
          var emailComposerRecipient = emailComposerLayer.querySelector("[data-email-compose-recipient]");
          var emailComposerRecipientKey = emailComposerLayer.querySelector("[data-email-compose-recipient-key]");
          var emailComposerSubject = emailComposerLayer.querySelector("[data-email-compose-subject]");
          var emailComposerReplyTo = emailComposerLayer.querySelector("[data-email-compose-reply-to]");
          var emailComposerContent = emailComposerLayer.querySelector("[data-email-compose-content]");
          var emailComposerContentValue = emailComposerLayer.querySelector("[data-email-compose-content-value]");
          var emailComposerTemplate = emailComposerLayer.querySelector("[data-email-compose-template]");
          var emailComposerTemplateId = emailComposerLayer.querySelector("[data-email-compose-template-id]");
          var emailComposerTemplateStatus = emailComposerLayer.querySelector("[data-email-compose-template-status]");
          var emailComposerForm = emailComposerLayer.querySelector(".email-compose-form");
          var emailComposerTrigger = null;
          var emailComposerTemplateRequest = 0;

          function syncEmailComposerContent() {
            if (emailComposerContent && emailComposerContentValue) {
              emailComposerContentValue.value = emailComposerContent.innerHTML;
            }
          }

          function runEmailComposerCommand(command, value) {
            if (!emailComposerContent) { return; }
            emailComposerContent.focus();
            document.execCommand("styleWithCSS", false, false);
            document.execCommand(command, false, value || null);
            syncEmailComposerContent();
          }

          if (emailComposerContent && emailComposerContentValue) {
            emailComposerContent.addEventListener("input", syncEmailComposerContent);
            emailComposerContent.addEventListener("blur", syncEmailComposerContent);
            emailComposerLayer.addEventListener("mousedown", function (event) {
              if (event.target.closest("button[data-rich-command]")) { event.preventDefault(); }
            });
            emailComposerLayer.querySelectorAll("button[data-rich-command]").forEach(function (control) {
              control.addEventListener("click", function () { runEmailComposerCommand(control.dataset.richCommand || ""); });
            });
            emailComposerLayer.querySelectorAll("select[data-rich-command]").forEach(function (control) {
              control.addEventListener("change", function () { runEmailComposerCommand(control.dataset.richCommand || "", control.value); });
            });
            emailComposerLayer.querySelectorAll("[data-rich-color]").forEach(function (control) {
              control.addEventListener("input", function () { runEmailComposerCommand("foreColor", control.value); });
            });
            if (emailComposerForm) { emailComposerForm.addEventListener("submit", syncEmailComposerContent); }
          }

          function setEmailComposerTemplateStatus(message) {
            if (emailComposerTemplateStatus) { emailComposerTemplateStatus.textContent = message; }
          }

          if (emailComposerTemplate && emailComposerTemplateId) {
            emailComposerTemplate.addEventListener("change", function () {
              var templateId = emailComposerTemplate.value;
              var requestId = ++emailComposerTemplateRequest;
              emailComposerTemplateId.value = templateId;
              if (!templateId) {
                setEmailComposerTemplateStatus("");
                return;
              }
              var templateBaseUrl = emailComposerLayer.dataset.emailTemplateUrl;
              if (!templateBaseUrl) {
                setEmailComposerTemplateStatus("Vorlage ausgewählt. Bitte einen Kontakt aus der Ergebnisliste wählen, damit Platzhalter gesetzt werden.");
                return;
              }
              setEmailComposerTemplateStatus("Vorlage wird geladen ...");
              var templateUrl = templateBaseUrl + "/" + encodeURIComponent(templateId);
              var recipientKey = emailComposerRecipientKey && emailComposerRecipientKey.value
                ? emailComposerRecipientKey.value
                : (emailComposerRecipient && emailComposerRecipient.tagName === "SELECT" ? emailComposerRecipient.value : "");
              if (recipientKey) {
                templateUrl += "?recipient_key=" + encodeURIComponent(recipientKey);
              }
              window.fetch(templateUrl, {
                credentials: "same-origin",
                headers: { "Accept": "application/json" }
              }).then(function (response) {
                return response.json().catch(function () { return {}; }).then(function (payload) {
                  if (!response.ok) { throw new Error(payload.detail || "Die Zoho-Vorlage konnte nicht geladen werden."); }
                  return payload;
                });
              }).then(function (template) {
                if (requestId !== emailComposerTemplateRequest) { return; }
                if (emailComposerSubject) { emailComposerSubject.value = template.subject || ""; }
                if (emailComposerContent) { emailComposerContent.innerHTML = template.content || ""; }
                syncEmailComposerContent();
                var unresolved = Array.isArray(template.unresolved_placeholders) ? template.unresolved_placeholders : [];
                setEmailComposerTemplateStatus(
                  unresolved.length
                    ? "Vorlage geladen. Nicht aufgelöste Platzhalter: " + unresolved.join(", ")
                    : "Vorlage „" + (template.name || "Zoho") + "“ als bearbeitbarer Entwurf geladen."
                );
              }).catch(function (error) {
                if (requestId !== emailComposerTemplateRequest) { return; }
                emailComposerTemplateId.value = "";
                emailComposerTemplate.value = "";
                setEmailComposerTemplateStatus(error.message || "Die Zoho-Vorlage konnte nicht geladen werden.");
              });
            });
          }

          function selectEmailRecipient(email) {
            if (!email || !emailComposerRecipient) { return; }
            var normalizedEmail = email.trim().toLowerCase();
            if (emailComposerRecipient.tagName === "INPUT") {
              emailComposerRecipient.value = email;
              emailComposerRecipient.dispatchEvent(new Event("input", { bubbles: true }));
              return;
            }
            Array.prototype.some.call(emailComposerRecipient.options, function (option) {
              if ((option.dataset.recipientEmail || "").toLowerCase() !== normalizedEmail) { return false; }
              emailComposerRecipient.value = option.value;
              return true;
            });
          }

          function openEmailComposer(trigger) {
            emailComposerTrigger = trigger;
            var replyToEmailId = trigger.dataset.emailComposeReplyToEmailId || "";
            if (emailComposerReplyTo) { emailComposerReplyTo.value = replyToEmailId; }
            if (replyToEmailId && emailComposerSubject) {
              emailComposerSubject.value = trigger.dataset.emailComposeReplySubject || emailComposerSubject.value;
            }
            selectEmailRecipient(trigger.dataset.recipientEmail || "");
            emailComposerLayer.hidden = false;
            emailComposerLayer.classList.add("is-open");
            emailComposerDrawer.setAttribute("aria-hidden", "false");
            document.body.classList.add("email-compose-open");
            window.setTimeout(function () {
              (emailComposerSubject || emailComposerRecipient || emailComposerDrawer).focus();
            }, 230);
          }

          function closeEmailComposer() {
            emailComposerLayer.classList.remove("is-open");
            emailComposerDrawer.setAttribute("aria-hidden", "true");
            document.body.classList.remove("email-compose-open");
            window.setTimeout(function () {
              if (!emailComposerLayer.classList.contains("is-open")) { emailComposerLayer.hidden = true; }
            }, 230);
            if (emailComposerTrigger) { emailComposerTrigger.focus(); }
          }

          document.addEventListener("click", function (event) {
            var openTrigger = event.target.closest("[data-email-compose-open]");
            if (openTrigger) {
              event.preventDefault();
              openEmailComposer(openTrigger);
              return;
            }
            if (event.target.closest("[data-email-compose-close]")) { closeEmailComposer(); }
          });

          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !emailComposerLayer.hidden) {
              event.preventDefault();
              closeEmailComposer();
            }
          });
          if (emailComposerLayer.hasAttribute("data-email-compose-autostart")) {
            openEmailComposer(emailComposerLayer);
          }
        }

        document.querySelectorAll("[data-note-composer]").forEach(function (composer) {
          var opener = composer.querySelector("[data-note-composer-open]");
          var form = composer.querySelector("[data-note-composer-form]");
          var content = composer.querySelector("[data-note-composer-content]");
          var cancel = composer.querySelector("[data-note-composer-cancel]");
          if (!opener || !form || !content || !cancel) { return; }

          function openNoteComposer() {
            opener.hidden = true;
            form.hidden = false;
            content.focus();
          }

          function closeNoteComposer() {
            form.reset();
            form.hidden = true;
            opener.hidden = false;
          }

          opener.addEventListener("click", openNoteComposer);
          cancel.addEventListener("click", closeNoteComposer);
        });

        document.querySelectorAll("[data-expandable-section]").forEach(function (section) {
          var content = section.querySelector("[data-expandable-content]");
          var toggle = section.querySelector("[data-expandable-toggle]");
          if (!content || !toggle) { return; }

          function updateExpandableSection() {
            if (content.classList.contains("is-expanded")) {
              toggle.hidden = false;
              return;
            }
            content.classList.remove("is-truncated");
            toggle.hidden = true;
            if (content.scrollHeight > content.clientHeight + 2) {
              content.classList.add("is-truncated");
              toggle.hidden = false;
            }
          }

          toggle.addEventListener("click", function () {
            var expanded = content.classList.toggle("is-expanded");
            toggle.textContent = expanded ? "Weniger anzeigen" : "Weiter lesen ...";
            window.requestAnimationFrame(updateExpandableSection);
          });
          if (window.ResizeObserver) {
            new ResizeObserver(updateExpandableSection).observe(content);
          }
          window.addEventListener("resize", updateExpandableSection);
          window.requestAnimationFrame(updateExpandableSection);
        });

        document.addEventListener("toggle", function (event) {
          var details = event.target;
          if (!(details instanceof HTMLDetailsElement) || !details.open) { return; }
          var content = details.closest("[data-expandable-content]");
          if (!content) { return; }
          var section = content.closest("[data-expandable-section]");
          var toggle = section && section.querySelector("[data-expandable-toggle]");
          content.classList.add("is-expanded");
          if (toggle) {
            toggle.hidden = false;
            toggle.textContent = "Weniger anzeigen";
          }
        }, true);
      }());
    </script>
  </body>
</html>
