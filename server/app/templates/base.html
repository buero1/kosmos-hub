<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --panel: #fffaf2;
        --ink: #1d2a2f;
        --muted: #6c7469;
        --accent: #0e7c66;
        --accent-soft: #d7efe8;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #fffaf2 0, transparent 25%),
          linear-gradient(180deg, #f9f5ec 0%, var(--bg) 55%, #efe8da 100%);
        color: var(--ink);
      }
      header, main {
        width: min(1100px, calc(100vw - 2rem));
        margin: 0 auto;
      }
      header {
        padding: 2rem 0 1rem;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        margin-right: 1rem;
      }
      h1, h2, h3 {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hero {
        background: rgba(255, 250, 242, 0.75);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(40, 45, 44, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1rem 1.1rem;
      }
      .metric {
        font-size: 2rem;
        margin: 0.4rem 0 0;
      }
      .subtle {
        color: var(--muted);
      }
      .eyebrow {
        margin: 0 0 0.35rem;
        color: var(--accent);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 2rem 0 1rem;
      }
      .section-heading h2 {
        margin: 0;
      }
      .section-heading .subtle {
        margin-bottom: 0;
      }
      .inventory-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.65rem;
        color: var(--muted);
      }
      .inventory-totals span {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 0.7rem;
        background: var(--panel);
      }
      .filter-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 0.85rem;
        align-items: end;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .filter-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .filter-panel input,
      .filter-panel select,
      .plan-panel input,
      .plan-panel textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .plan-panel {
        display: grid;
        grid-template-columns: 1.2fr minmax(170px, 0.8fr) minmax(220px, 1fr) auto;
        gap: 0.85rem;
        align-items: end;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .plan-panel p { margin: 0.25rem 0; }
      .plan-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .plan-panel textarea { resize: vertical; }
      .plan-panel-locked { grid-template-columns: 1fr; }
      .account-panel {
        max-width: 42rem;
        display: grid;
        gap: 0.9rem;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .account-panel.account-panel-wide { max-width: 72rem; }
      .account-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .account-panel input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .assistant-panel,
      .assistant-answer {
        max-width: 52rem;
        margin: 1.25rem 0;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .assistant-panel {
        display: grid;
        gap: 0.75rem;
      }
      .assistant-panel label {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .assistant-panel textarea {
        width: 100%;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        line-height: 1.45;
        padding: 0.75rem;
      }
      .assistant-panel p,
      .assistant-answer p { margin: 0.25rem 0; }
      .assistant-text {
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .account-panel form {
        display: grid;
        gap: 0.7rem;
      }
      .token-value {
        display: block;
        overflow-wrap: anywhere;
        border: 1px solid #8dbdae;
        border-radius: 9px;
        background: var(--accent-soft);
        color: #075f4e;
        padding: 0.75rem;
      }
      .notice-error {
        border-left: 4px solid #a34a2b;
        padding: 0.7rem 0.85rem;
        background: #f7e5db;
        color: #71341f;
      }
      .notice-success {
        border-left: 4px solid var(--accent);
        padding: 0.7rem 0.85rem;
        background: var(--accent-soft);
        color: #075f4e;
      }
      .site-removal-panel {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.25rem;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid #d9b9aa;
        border-radius: 18px;
        background: #fbf0e9;
      }
      .site-removal-panel h3,
      .site-removal-panel p { margin: 0.25rem 0; }
      .site-detail-layout {
        display: grid;
        grid-template-columns: minmax(190px, 220px) minmax(0, 1fr);
        align-items: start;
        gap: 1.5rem;
        margin: 1.5rem 0 2rem;
      }
      .site-detail-content {
        min-width: 0;
      }
      .site-sidebar {
        position: sticky;
        top: 1rem;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .site-sidebar h2 {
        margin: 0.25rem 0;
        overflow-wrap: anywhere;
      }
      .site-sidebar .subtle {
        margin: 0.5rem 0 1rem;
      }
      .site-section-nav {
        display: grid;
        gap: 0.35rem;
      }
      .site-section-nav a {
        margin-right: 0;
        padding: 0.65rem 0.75rem;
        border-radius: 10px;
        color: var(--ink);
        font-family: "Trebuchet MS", sans-serif;
        font-weight: 700;
      }
      .site-section-nav a:hover,
      .site-section-nav a:focus-visible {
        background: var(--accent-soft);
        color: #075f4e;
      }
      .site-back-link.button {
        width: 100%;
        margin-top: 1rem;
        text-align: center;
      }
      .site-section {
        scroll-margin-top: 1rem;
      }
      .site-section + .site-section {
        margin-top: 3rem;
      }
      .site-section-heading {
        margin-top: 0;
      }
      .site-dashboard-action,
      .backup-status-card {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.25rem;
        margin-top: 1rem;
      }
      .site-dashboard-action {
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .site-dashboard-action h3,
      .site-dashboard-action p,
      .backup-status-card h3,
      .backup-status-card p {
        margin: 0.25rem 0;
      }
      .backup-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.75rem;
      }
      .active-update-status {
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid #8dbdae;
        border-radius: 18px;
        background: rgba(215, 239, 232, 0.48);
      }
      .active-update-status h3,
      .active-update-status p {
        margin: 0.25rem 0;
      }
      .active-update-status .table-scroll {
        margin-top: 0.85rem;
      }
      .site-update-panel {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      button.button.button-danger {
        background: #a34a2b;
        color: white;
      }
      .filter-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      button.button {
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
      button.button.button-secondary {
        background: transparent;
        color: var(--accent);
      }
      .button-secondary {
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
      }
      .result-count {
        margin: 1.25rem 0 0.65rem;
        color: var(--muted);
      }
      .table-scroll {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        border-radius: 18px;
      }
      .update-workbench-table {
        min-width: 1320px;
      }
      .table-note {
        max-width: 18rem;
        margin: 0.25rem 0 0;
        overflow-wrap: anywhere;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 250, 242, 0.85);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tr:last-child td { border-bottom: none; }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.9rem;
      }
      .pill-missing {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-unknown {
        background: #e7e8e6;
        color: #566057;
      }
      .pill-wordpress {
        background: #f2dfd2;
        color: #8a3f25;
      }
      .pill-plugin,
      .pill-active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .pill-theme,
      .pill-system {
        background: #e7e8e6;
        color: #566057;
      }
      .pill-inactive {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-postflight_failed {
        background: #f7e5db;
        color: #71341f;
      }
      .pill-running,
      .pill-waiting {
        background: #f3e3c3;
        color: #8b5a12;
      }
      .pill-succeeded {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .pill-failed {
        background: #f7e5db;
        color: #71341f;
      }
      .postflight-card .notice-success,
      .postflight-card .notice-error {
        margin: 0.75rem 0;
      }
      .detail-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      .detail-list .card p {
        margin: 0.25rem 0;
      }
      .capability-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
        margin: 0.75rem 0;
      }
      .capability-summary p {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        margin: 0 !important;
        padding: 0.55rem 0.6rem;
        border-radius: 12px;
        background: var(--accent-soft);
      }
      .capability-summary strong {
        color: var(--accent);
        font-size: 1.15rem;
      }
      .capability-summary span {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .capability-details {
        margin-top: 0.85rem;
      }
      .capability-details summary {
        color: var(--accent);
        cursor: pointer;
        font-weight: 700;
      }
      .capability-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.75rem;
      }
      .capability-tag {
        max-width: 100%;
        overflow: hidden;
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--paper);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        overflow-wrap: anywhere;
      }
      .maintenance-history {
        margin-top: 0;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
      }
      a.button.button-secondary {
        background: transparent;
        color: var(--accent);
      }
      @media (max-width: 720px) {
        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .inventory-totals {
          justify-content: flex-start;
        }
        .filter-panel {
          grid-template-columns: 1fr;
        }
        .plan-panel {
          grid-template-columns: 1fr;
        }
        .site-detail-layout {
          grid-template-columns: 1fr;
        }
        .site-sidebar {
          position: static;
        }
        .site-section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .site-dashboard-action,
        .backup-status-card {
          align-items: flex-start;
          flex-direction: column;
        }
        .backup-actions {
          justify-content: flex-start;
        }
        .site-update-panel {
          grid-template-columns: 1fr;
        }
        .site-removal-panel {
          align-items: flex-start;
          flex-direction: column;
        }
        th, td {
          padding: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hero">
        <h1>kosmos-hub</h1>
        <p class="subtle">Phase 1 registry, onboarding and visibility for managed WordPress sites.</p>
        <nav>
          <a href="/">Dashboard</a>
          <a href="/sites">Sites</a>
          <a href="/updates">Update workbench</a>
          <a href="/update-plans">Plans</a>
          <a href="/assistant">Assistant</a>
          <a href="/account">Account</a>
          <a href="/healthz">Health</a>
        </nav>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
