<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --panel: #fffaf2;
        --ink: #1d2a2f;
        --muted: #6c7469;
        --accent: #0e7c66;
        --accent-soft: #d7efe8;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #fffaf2 0, transparent 25%),
          linear-gradient(180deg, #f9f5ec 0%, var(--bg) 55%, #efe8da 100%);
        color: var(--ink);
      }
      header, main {
        width: min(1540px, calc(100vw - 2rem));
        margin: 0 auto;
      }
      header {
        padding: 0 0 1rem;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        margin-right: 1rem;
      }
      h1, h2, h3 {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hero {
        background: rgba(255, 250, 242, 0.75);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(40, 45, 44, 0.06);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1rem 1.1rem;
      }
      .metric {
        font-size: 2rem;
        margin: 0.4rem 0 0;
      }
      .subtle {
        color: var(--muted);
      }
      .eyebrow {
        margin: 0 0 0.35rem;
        color: var(--accent);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 2rem 0 1rem;
      }
      .section-heading h2 {
        margin: 0;
      }
      .section-heading .subtle {
        margin-bottom: 0;
      }
      .inventory-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.65rem;
        color: var(--muted);
      }
      .inventory-totals span {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 0.7rem;
        background: var(--panel);
      }
      .filter-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 0.85rem;
        align-items: end;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .filter-panel-workbench {
        grid-template-columns: repeat(4, minmax(150px, 1fr));
      }
      .workbench-page-layout {
        display: grid;
        grid-template-columns: 17.5rem minmax(0, 1fr);
        align-items: start;
        gap: 1rem;
        margin: 1.5rem 0 2rem;
      }
      .workbench-page-main {
        min-width: 0;
      }
      .workbench-page-main .section-heading {
        margin-top: 0;
      }
      .workbench-site-selector {
        position: sticky;
        top: 1rem;
        padding: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .workbench-site-selector form {
        display: grid;
        gap: 0.8rem;
      }
      .site-selector-heading h3 {
        margin: 0;
      }
      .site-selector-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.25rem;
      }
      .site-selector-tab {
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: 700 0.78rem "Trebuchet MS", sans-serif;
        padding: 0.5rem 0.35rem;
      }
      .site-selector-tab:hover,
      .site-selector-tab:focus-visible,
      .site-selector-tab.is-active {
        background: var(--accent-soft);
        color: #075f4e;
      }
      .site-selector-search input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .site-selector-selection-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.45rem;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .site-selector-selection-tools button {
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0;
      }
      .site-selector-selection-tools strong {
        color: var(--accent);
        white-space: nowrap;
      }
      .site-selector-list {
        display: grid;
        max-height: min(39vh, 23.25rem);
        gap: 0.05rem;
        overflow: auto;
        padding-right: 0.2rem;
      }
      .site-selector-list[hidden] { display: none; }
      .site-selector-row {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.43rem 0.25rem;
        border-radius: 8px;
        color: var(--ink);
        cursor: pointer;
        font-size: 0.88rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .site-selector-row:hover { background: rgba(215, 239, 232, 0.6); }
      .site-selector-row input { flex: 0 0 auto; margin: 0.14rem 0 0; accent-color: var(--accent); }
      .site-selector-row small {
        display: block;
        margin-top: 0.1rem;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .site-selector-submit-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.5rem;
        margin-top: 0.15rem;
      }
      .site-selector-submit {
        width: auto;
        margin: 0;
        min-width: 5.25rem;
      }
      .site-selector-submit-actions select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        padding: 0.58rem 0.65rem;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .customer-filter-panel {
        grid-template-columns: minmax(260px, 1fr) minmax(220px, 0.75fr) auto;
      }
      .filter-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .filter-panel input,
      .filter-panel select,
      .plan-panel input,
      .plan-panel textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
        font: inherit;
        padding: 0.58rem 0.65rem;
      }
      .plan-panel {
        display: grid;
        grid-template-columns: 1.2fr minmax(170px, 0.8fr) minmax(220px, 1fr) auto;
        gap: 0.85rem;
        align-items: end;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .plan-panel p { margin: 0.25rem 0; }
      .plan-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .plan-panel textarea { resize: vertical; }
      .plan-panel-locked { grid-template-columns: 1fr; }
      .workbench-action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
        margin: 1.25rem 0;
      }
      .workbench-action-panel {
        display: grid;
        grid-template-columns: minmax(240px, 0.9fr) minmax(180px, 1fr) auto;
        align-items: end;
        gap: 0.75rem 1rem;
        margin: 1rem 0;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 250, 242, 0.72);
      }
      .workbench-action-panel label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .workbench-action-panel [data-site-selector-target-sites] { display: contents; }
      .workbench-action-panel select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .workbench-action-panel .subtle { margin: 0 0 0.2rem; }
      .workbench-action-panel .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .direct-update-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 1rem;
        margin: 1.25rem 0 2.5rem;
      }
      .direct-update-controls .subtle { margin: 0; }
      .direct-update-controls .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .update-confirmation-dialog {
        width: min(31rem, calc(100vw - 2rem));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.25rem;
        color: var(--ink);
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(29, 42, 47, 0.2);
      }
      .update-confirmation-dialog::backdrop { background: rgba(29, 42, 47, 0.32); }
      .update-confirmation-dialog h3 { margin: 0; }
      .update-confirmation-dialog p { margin: 0.75rem 0 1.15rem; }
      .update-confirmation-dialog .dialog-selection-heading {
        margin: 0 0 0.35rem;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
      }
      .update-confirmation-list {
        max-height: 13rem;
        margin: 0 0 1.15rem;
        padding: 0;
        overflow-y: auto;
        border-top: 1px solid var(--border);
        list-style: none;
      }
      .update-confirmation-list li {
        display: grid;
        gap: 0.15rem;
        padding: 0.6rem 0;
        border-bottom: 1px solid var(--border);
      }
      .update-confirmation-list span { color: var(--muted); font-size: 0.9rem; }
      .update-confirmation-safeguard { margin: 0 0 1.15rem; }
      .update-confirmation-safeguard label { display: grid; gap: 0.45rem; font-weight: 700; }
      .update-confirmation-safeguard input { width: 100%; }
      .update-confirmation-safeguard .subtle { margin: 0.35rem 0 0; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 0.65rem; }
      .fleet-refresh-status-card {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #8dbdae;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(232, 246, 240, 0.88), rgba(255, 250, 242, 0.9));
      }
      .fleet-refresh-status-card .section-heading { margin-bottom: 0.75rem; }
      .fleet-refresh-status-card h3 { display: flex; align-items: center; gap: 0.55rem; }
      .fleet-refresh-progress-track {
        height: 1.4rem;
        overflow: hidden;
        border-radius: 2px;
        background: #d7e6df;
      }
      .fleet-refresh-progress-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #087f6b, #33a88d);
        transition: width 260ms ease;
      }
      .fleet-refresh-progress-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin-top: 0.7rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .fleet-refresh-progress-meta strong { color: var(--ink); }
      .fleet-refresh-status-card [data-refresh-summary] { margin: 0.75rem 0 0; }
      .fleet-refresh-status-card [data-refresh-complete] {
        margin: 0.75rem 0 0;
        border-left: 0;
        padding-left: 0;
        padding-right: 0;
        background: transparent;
      }
      .fleet-refresh-cancel-form {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.85rem;
      }
      .fleet-refresh-cancel-form .button { min-width: 7rem; }
      .direct-update-status-card {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #8dbdae;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(232, 246, 240, 0.88), rgba(255, 250, 242, 0.9));
      }
      .direct-update-status-card .section-heading { margin-bottom: 0.75rem; }
      .direct-update-cancel-form { margin: 0; }
      .direct-update-cancel-form .button { min-width: 7rem; }
      .direct-update-progress-track {
        height: 1.4rem;
        overflow: hidden;
        border-radius: 2px;
        background: #d7e6df;
      }
      .direct-update-progress-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #087f6b, #33a88d);
        transition: width 260ms ease;
      }
      .direct-update-run-table { min-width: 680px; }
      .direct-update-run-table th,
      .direct-update-run-table td { vertical-align: middle; }
      .direct-update-run-table td:nth-child(2) {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .complete-site-update-launch { margin: 1rem 0; }
      .complete-site-update-progress-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin: 0.75rem 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .complete-site-update-status-card .direct-update-run-table td:nth-child(2) { display: table-cell; }
      .direct-update-status {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .direct-update-status-icon {
        display: inline-block;
        box-sizing: border-box;
        width: 1rem;
        height: 1rem;
        flex: 0 0 1rem;
      }
      .direct-update-status-icon.is-processing {
        border: 2px solid #9dcfc1;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: direct-update-spin 0.8s linear infinite;
      }
      .direct-update-status-icon.is-succeeded {
        width: 0.55rem;
        height: 0.9rem;
        margin: 0 0.2rem;
        border-right: 2px solid var(--accent);
        border-bottom: 2px solid var(--accent);
        transform: rotate(45deg) translateY(-0.1rem);
      }
      .direct-update-status-icon.is-failed {
        border: 2px solid #b64c2d;
        border-radius: 50%;
      }
      .direct-update-status-icon.is-failed::after {
        content: "";
        display: block;
        width: 2px;
        height: 0.45rem;
        margin: 0.12rem auto 0;
        background: #b64c2d;
        box-shadow: 0 0.53rem 0 -0.03rem #b64c2d;
      }
      .direct-update-status-icon.is-skipped,
      .direct-update-status-icon.is-queued {
        height: 2px;
        margin-top: 0.05rem;
        background: var(--muted);
      }
      @keyframes direct-update-spin { to { transform: rotate(360deg); } }
      .plugin-install-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin: 1rem 0 1.25rem;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .plugin-install-form > label,
      .plugin-install-form fieldset {
        display: grid;
        gap: 0.45rem;
        margin: 0;
        border: 0;
        padding: 0;
      }
      .plugin-install-form legend,
      .plugin-install-form > label > span {
        color: var(--muted);
        font-size: 0.84rem;
      }
      .plugin-install-form small { color: var(--muted); line-height: 1.35; }
      .plugin-source-options,
      .plugin-install-options { align-content: start; }
      .plugin-source-options label,
      .plugin-install-options label { color: var(--ink); }
      .plugin-install-submit {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border);
      }
      .plugin-install-submit p { margin: 0; }
      .workbench-action-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1rem;
        min-width: 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .workbench-action-card .filter-actions {
        flex-wrap: wrap;
      }
      .user-workbench-action-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .user-workbench-create {
        margin: 1.25rem 0;
        padding: 0.9rem 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.72);
      }
      .user-workbench-create summary {
        color: #075f4e;
        cursor: pointer;
        font-family: "Trebuchet MS", sans-serif;
        font-weight: 700;
      }
      .user-workbench-create form {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
        align-items: end;
        margin-top: 0.9rem;
      }
      .user-workbench-create label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .user-workbench-create input,
      .user-workbench-create select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .user-workbench-create .password-input { padding-right: 5rem; }
      .user-workbench-create-actions { grid-column: 1 / -1; }
      .user-workbench-create > .subtle { margin: 0.8rem 0 0; }
      .user-workbench-action-card label {
        display: grid;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .user-workbench-action-card input,
      .user-workbench-action-card select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .user-workbench-action-card .password-input {
        padding-right: 5rem;
      }
      .bulk-action-warning {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
      }
      .bulk-action-confirmation {
        display: flex !important;
        grid-template-columns: none !important;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .bulk-action-confirmation input {
        width: auto;
        margin-top: 0.2rem;
      }
      .user-workbench-table { min-width: 1160px; }
      .user-workbench-table td:last-child { min-width: 12rem; }
      .user-batch-results { margin: 1.25rem 0; }
      .user-delete-review-table { min-width: 960px; }
      .info-tooltip {
        position: relative;
        display: inline-grid;
        width: 1.2rem;
        height: 1.2rem;
        place-items: center;
        margin-left: 0.25rem;
        padding: 0;
        border: 1px solid var(--accent);
        border-radius: 50%;
        background: var(--panel);
        color: var(--accent);
        cursor: help;
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1;
        vertical-align: text-bottom;
      }
      .info-tooltip-content {
        position: absolute;
        z-index: 10;
        top: calc(100% + 0.45rem);
        left: 0;
        display: none;
        width: min(25rem, calc(100vw - 3rem));
        padding: 0.75rem;
        border: 1px solid #8dbdae;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 12px 28px rgba(40, 45, 44, 0.16);
        color: var(--ink);
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.35;
        text-align: left;
      }
      .info-tooltip:hover .info-tooltip-content,
      .info-tooltip:focus-visible .info-tooltip-content {
        display: block;
      }
      .account-panel {
        max-width: 42rem;
        display: grid;
        gap: 0.9rem;
        margin: 1.25rem 0;
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .account-page-layout {
        display: grid;
        grid-template-columns: minmax(11.5rem, 14rem) minmax(0, 1fr);
        align-items: start;
        gap: 1.25rem;
        margin: 1.5rem 0 2.5rem;
      }
      .account-page-content { min-width: 0; }
      .account-page-content .section-heading { margin-top: 0; }
      .account-page-sidebar {
        position: sticky;
        top: 1rem;
        padding: 0.85rem;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 250, 242, 0.82);
      }
      .account-page-sidebar .eyebrow { margin: 0.15rem 0 0.55rem; }
      .account-section-nav {
        display: grid;
        gap: 0.3rem;
      }
      .account-section-nav a {
        margin-right: 0;
        border-radius: 10px;
        color: var(--ink);
        font: 700 0.8rem "Trebuchet MS", sans-serif;
        padding: 0.6rem 0.7rem;
      }
      .account-section-nav a:hover,
      .account-section-nav a:focus-visible {
        background: var(--accent-soft);
        color: #075f4e;
      }
      .account-section-nav a[aria-current="page"] {
        background: var(--accent);
        color: #fffdf8;
      }
      .account-section { scroll-margin-top: 1rem; }
      .account-section[hidden] { display: none; }
      .account-session {
        display: grid;

          grid-template-columns: 1fr;
        }
        .plan-panel {
          grid-template-columns: 1fr;
        }
        .workbench-action-grid {
          grid-template-columns: 1fr;
        }
        .workbench-action-panel { grid-template-columns: 1fr; }
        .direct-update-controls { align-items: stretch; flex-direction: column; }
        .plugin-install-form { grid-template-columns: 1fr; }
        .plugin-install-submit { align-items: flex-start; flex-direction: column; }
        .user-workbench-create form {
          grid-template-columns: 1fr;
        }
        .workbench-page-layout {
          grid-template-columns: 1fr;
          margin-top: 1rem;
        }
        .account-page-layout {
          grid-template-columns: 1fr;
          gap: 0.75rem;
          margin-top: 1rem;
        }
        .account-page-sidebar { position: static; }
        .account-section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .workbench-site-selector {
          position: static;
        }
        .site-selector-list { max-height: 14.25rem; }
        .site-detail-layout {
          grid-template-columns: 1fr;
        }
        .site-sidebar {
          position: static;
        }
        .site-section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .maintenance-history-entry > summary {
          grid-template-columns: auto auto minmax(0, 1fr);
        }
        .maintenance-history-entry-time {
          grid-column: 2 / -1;
          white-space: normal;
        }
        .maintenance-history-entry-details {
          grid-template-columns: 1fr;
        }
        .site-user-form {
          grid-template-columns: 1fr;
        }
        .site-dashboard-action,
        .backup-status-card {
          align-items: flex-start;
          flex-direction: column;
        }
        .backup-actions {
          justify-content: flex-start;
        }
        .site-update-panel {
          grid-template-columns: 1fr;
        }
        .site-removal-panel {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
