<script>
  (function () {
    document.querySelectorAll('[data-finance-customer-search]').forEach(function (root) {
      var form = root.closest('form');
      var input = root.querySelector('[data-finance-customer-input]');
      var selectedId = root.querySelector('[data-finance-customer]');
      var list = root.querySelector('.finance-customer-options');
      var empty = root.querySelector('[data-finance-customer-empty]');
      var options = Array.from(root.querySelectorAll('[data-finance-customer-option]'));
      var contact = form && form.querySelector('[data-finance-contact]');
      var linkedRecord = form && form.querySelector('[data-finance-linked-record]');
      var visible = [];
      var activeIndex = -1;
      function normalize(value) {
        return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('de');
      }
      function filterContacts() {
        if (!contact) return;
        Array.from(contact.options).forEach(function (option) {
          if (!option.dataset.customerId) return;
          var available = option.dataset.customerId === selectedId.value;
          option.hidden = !available;
          option.disabled = !available;
          if (!available && option.selected) contact.value = '';
        });
      }
      function filterLinkedRecords() {
        if (!linkedRecord) return;
        Array.from(linkedRecord.options).forEach(function (option) {
          if (!option.dataset.customerId) return;
          var available = option.dataset.customerId === selectedId.value;
          option.hidden = !available;
          option.disabled = !available;
          if (!available && option.selected) linkedRecord.value = '';
        });
      }
      function closeList() {
        list.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        options.forEach(function (option) { option.classList.remove('is-active'); });
        activeIndex = -1;
      }
      function showMatches() {
        var query = normalize(input.value.trim());
        visible = options.filter(function (option) { return normalize(option.textContent).includes(query); }).slice(0, 40);
        options.forEach(function (option) { option.hidden = !visible.includes(option); });
        empty.hidden = visible.length > 0;
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
        activeIndex = -1;
      }
      function setActive(index) {
        activeIndex = index;
        visible.forEach(function (option, optionIndex) {
          option.classList.toggle('is-active', optionIndex === index);
        });
        if (visible[index]) visible[index].scrollIntoView({ block: 'nearest' });
      }
      function choose(option) {
        input.value = option.textContent.trim();
        selectedId.value = option.dataset.customerId;
        input.setCustomValidity('');
        options.forEach(function (item) {
          item.setAttribute('aria-selected', String(item === option));
        });
        selectedId.dispatchEvent(new Event('change', { bubbles: true }));
        closeList();
      }
      input.addEventListener('focus', showMatches);
      input.addEventListener('input', function () {
        var selected = options.find(function (option) { return option.dataset.customerId === selectedId.value; });
        if (!selected || input.value !== selected.textContent.trim()) {
          selectedId.value = '';
          selectedId.dispatchEvent(new Event('change', { bubbles: true }));
          input.setCustomValidity(input.value ? 'Bitte einen Kunden aus der Liste auswählen.' : '');
        }
        showMatches();
      });
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { closeList(); return; }
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          if (list.hidden) showMatches();
          if (visible.length) setActive((activeIndex + (event.key === 'ArrowDown' ? 1 : visible.length - 1)) % visible.length);
        }
        if (event.key === 'Enter' && !list.hidden && visible.length) {
          event.preventDefault();
          choose(visible[activeIndex < 0 ? 0 : activeIndex]);
        }
      });
      list.addEventListener('click', function (event) {
        var option = event.target.closest('[data-finance-customer-option]');
        if (option) choose(option);
      });
      document.addEventListener('pointerdown', function (event) {
        if (!root.contains(event.target)) closeList();
      });
      selectedId.addEventListener('change', function () {
        filterContacts();
        filterLinkedRecords();
      });
      filterContacts();
      filterLinkedRecords();
    });
  }());
</script>
