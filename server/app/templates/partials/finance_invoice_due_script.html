<script>
  (function () {
    document.querySelectorAll('[data-finance-document-form]').forEach(function (form) {
      var invoiceDate = form.querySelector('[name="document_field__invoice_date"]');
      var terms = form.querySelector('[name="document_field__payment_terms"]');
      var dueDate = form.querySelector('[name="document_field__due_date"]');
      if (!invoiceDate || !terms || !dueDate) return;
      function expectedDueDate() {
        var days = terms.value === 'due_on_receipt' ? 0 : /^\d+_days$/.test(terms.value) ? Number(terms.value.split('_')[0]) : null;
        if (days === null || !invoiceDate.value) return null;
        var date = new Date(invoiceDate.value + 'T00:00:00Z');
        if (Number.isNaN(date.getTime())) return null;
        date.setUTCDate(date.getUTCDate() + days);
        return date.toISOString().slice(0, 10);
      }
      function calculateDueDate() {
        var expected = expectedDueDate();
        if (expected !== null) dueDate.value = expected;
      }
      terms.addEventListener('change', calculateDueDate);
      invoiceDate.addEventListener('change', calculateDueDate);
      dueDate.addEventListener('change', function () {
        var expected = expectedDueDate();
        if (expected !== null && dueDate.value !== expected) terms.value = '';
      });

      var oneTime = form.querySelector('[data-invoice-service-mode]');
      var serviceDate = form.querySelector('[data-invoice-service-input="service_date"]');
      var periodStart = form.querySelector('[data-invoice-service-input="service_period_start"]');
      var periodEnd = form.querySelector('[data-invoice-service-input="service_period_end"]');
      if (!oneTime || !serviceDate || !periodStart || !periodEnd) return;
      var serviceInputs = [serviceDate, periodStart, periodEnd];
      var requiresService = form.hasAttribute('data-invoice-service-new') || oneTime.checked || serviceInputs.some(function (input) {
        return Boolean(input.value);
      });
      function setServiceControl(input, visible) {
        var control = input.closest('[data-invoice-service-field]');
        if (control) control.hidden = !visible;
        input.disabled = !visible;
        input.required = visible && requiresService;
      }
      function updateServiceFields(forceRequired) {
        if (forceRequired) requiresService = true;
        if (oneTime.checked && !serviceDate.value && invoiceDate.value) serviceDate.value = invoiceDate.value;
        setServiceControl(serviceDate, oneTime.checked);
        setServiceControl(periodStart, !oneTime.checked);
        setServiceControl(periodEnd, !oneTime.checked);
      }
      oneTime.addEventListener('change', function () { updateServiceFields(true); });
      serviceInputs.forEach(function (input) {
        input.addEventListener('input', function () { updateServiceFields(true); });
      });
      updateServiceFields(false);
    });
  }());
</script>
