{% macro case_field_control(field, value="", customers=(), selected_customer_id=None, is_new=false) %}
  <label class="customer-field-control">
    <span>{{ field.label }}{% if field.required %} <small>erforderlich</small>{% endif %}</span>
    {% if field.key == "case_number" %}
      <input type="text" value="{{ value or 'Wird automatisch vergeben' }}" readonly>
    {% elif field.key == "customer_name" %}
      <select name="customer_id">
        <option value="">Keinen Kunden verknüpfen</option>
        {% for customer in customers %}
          <option value="{{ customer.id }}"{% if customer.id == selected_customer_id %} selected{% endif %}>{{ customer.name }}</option>
        {% endfor %}
      </select>
    {% elif field.display_type == "Auswahlliste" %}
      <select name="case_field__{{ field.key }}"{% if field.required %} required{% endif %}>
        <option value="">Auswählen</option>
        {% if value and value not in field.options %}
          <option value="{{ value }}" selected>{{ value }} (bestehender Zoho-Wert)</option>
        {% endif %}
        {% for option in field.options %}
          <option value="{{ option }}"{% if value == option %} selected{% endif %}>{% if option == "-None-" %}Keine Auswahl{% else %}{{ option }}{% endif %}</option>
        {% endfor %}
      </select>
    {% elif field.display_type == "Datum und Uhrzeit" %}
      <input type="datetime-local" name="case_field__{{ field.key }}" value="{{ value }}"{% if field.required %} required{% endif %}>
    {% elif field.display_type == "Mehrzeiliger Text" %}
      <textarea name="case_field__{{ field.key }}" rows="6"{% if field.required %} required{% endif %}>{{ value }}</textarea>
    {% elif field.display_type == "Ganzzahl" %}
      <input type="number" name="case_field__{{ field.key }}" value="{{ value }}" min="0" step="1" inputmode="numeric"{% if field.required %} required{% endif %}>
    {% else %}
      <input type="text" name="case_field__{{ field.key }}" value="{{ value }}"{% if field.required %} required{% endif %}>
    {% endif %}
  </label>
{% endmacro %}
