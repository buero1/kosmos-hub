{% macro contact_field_control(field, value="", required=false) %}
  {% set is_required = field.required or required %}
  <label class="customer-field-control">
    <span>{{ field.label }}{% if is_required %} <small>erforderlich</small>{% endif %}</span>
    {% if field.options %}
      <select name="contact_field__{{ field.key }}"{% if is_required %} required{% endif %}>
        <option value="">Auswählen</option>
        {% if value and value not in dict(field.options) %}<option value="{{ value }}" selected>{{ value }}</option>{% endif %}
        {% for option_value, option_label in field.options %}
          <option value="{{ option_value }}"{% if value == option_value %} selected{% endif %}>{{ option_label }}</option>
        {% endfor %}
      </select>
    {% elif field.display_type == "E-Mail" %}
      <input type="email" name="contact_field__{{ field.key }}" value="{{ value }}" autocomplete="email"{% if is_required %} required{% endif %}>
    {% elif field.display_type == "Telefon" %}
      <input type="tel" name="contact_field__{{ field.key }}" value="{{ value }}" autocomplete="tel"{% if is_required %} required{% endif %}>
    {% else %}
      <input type="text" name="contact_field__{{ field.key }}" value="{{ value }}"{% if is_required %} required{% endif %}>
    {% endif %}
  </label>
{% endmacro %}
