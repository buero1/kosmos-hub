<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosmos-hub{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --font-body: {{ styling.font_family }};
        --bg: {{ styling.background_color }};
        --bg-end: {{ styling.background_secondary_color }};
        --panel: {{ styling.panel_color }};
        --ink: {{ styling.ink_color }};
        --muted: {{ styling.muted_color }};
        --accent: {{ styling.accent_color }};
        --border: {{ styling.border_color }};
        --radius: {{ styling.panel_radius }}px;
        --control-radius: {{ styling.control_v1_radius }}px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink);
        background: linear-gradient(160deg, var(--bg), var(--bg-end));
      }
      .auth-shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 1.25rem;
      }
      .auth-card {
        width: min(100%, 27rem);
        min-width: 0;
        padding: clamp(1.4rem, 5vw, 2.4rem);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: 0 20px 60px rgba(29, 42, 47, 0.08);
        overflow-wrap: anywhere;
      }
      .auth-brand { margin: 0 0 0.65rem; font-size: 0.95rem; font-weight: 600; }
      h1 { margin: 0 0 1.6rem; font-size: 1.6rem; font-weight: 600; line-height: 1.25; }
      .subtle { color: var(--muted); line-height: 1.5; }
      .account-panel { display: grid; gap: 1.15rem; margin: 0; }
      label { display: grid; gap: 0.45rem; font-size: 0.9rem; }
      input {
        width: 100%;
        min-width: 0;
        min-height: 2.75rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--control-radius);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
      }
      .button {
        min-height: 2.75rem;
        margin-top: 0.35rem;
        padding: 0.65rem 1rem;
        border: 1px solid var(--accent);
        border-radius: var(--control-radius);
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      input:focus-visible, .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .button:hover { filter: brightness(0.94); }
      .notice-error, .notice-success { padding: 0.8rem; margin: 0 0 1.25rem; border-radius: var(--control-radius); line-height: 1.45; }
      .notice-error { color: #9b1c1c; background: #fff0f0; border: 1px solid #efb7b7; }
      .notice-success { color: #075f4e; background: #e7f5ed; border: 1px solid #abcdbb; }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="auth-brand">kosmos-hub</p>
        {% block content %}{% endblock %}
      </section>
    </main>
  </body>
</html>
