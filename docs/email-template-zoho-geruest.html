<!--
  Extracted layout frame from a Zoho email template.
  Replace the {{...}} placeholders with Hub content and locally hosted images.
  The Hub email compiler supplies the outer email document at send time.
-->
<style>
  @media screen and (max-width: 600px) {
    .hub-frame-content { padding: 20px !important; }
    .hub-frame-footer-cell { display: block !important; width: 100% !important; }
  }
</style>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#cfe2f3" style="width: 100%; background-color: #cfe2f3; border-collapse: collapse;">
  <tr>
    <td align="center" style="padding: 10px 8px 20px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width: 100%; max-width: 600px; background-color: #ffffff; border: 1px solid #8db7d5; border-collapse: collapse;">
        <tr>
          <td style="padding: 0 8px; background-color: #000000; border-bottom: 1px solid #ffff00;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
              <tr>
                <td style="padding: 6px 8px;">&nbsp;</td>
                <td align="right" style="padding: 6px 8px;">
                  <img src="{{HEADER_LOGO_URL}}" width="87" height="53" alt="Kosmos" style="display: block; max-width: 100%; height: auto; border: 0;">
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="hub-frame-content" style="padding: 24px 16px; color: #4d4d4d; font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.4;">
            {{CONTENT}}
          </td>
        </tr>

        <tr>
          <td style="padding: 6px 16px 20px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
              <tr>
                <td class="hub-frame-footer-cell" valign="middle" style="padding: 0;">
                  <img src="{{FOOTER_LOGO_URL}}" width="73" height="44" alt="Kosmos" style="display: block; max-width: 100%; height: auto; border: 0;">
                </td>
                <td class="hub-frame-footer-cell" valign="middle" style="padding: 0 0 0 12px; color: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 10px; line-height: 1.4;">
                  {{FOOTER_CONTENT}}
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
